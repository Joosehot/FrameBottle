# Every number Frame Bottle's motor uses. The code holds the logic, this file the taste.

# How many partial packs the beam keeps after each rule.
beam = 6

# The axes a pack trades between, as the command's --for asks for them.
[profile.size]    # the smallest bottle
pack = 0.1
play = 0.2
size = 1.0

[profile.play]    # the quickest unpacking
pack = 0.1
play = 1.0
size = 0.4

# One rule per decision. Each variant says how it scores on the axes (0 to 1).

# What a tile is told apart from: nothing (it stands on its own), the tile before it
# on the grid (only what differs from that tile is packed; it unpacks after that tile),
# or a guess of the whole tile (only the corrections to the guess are packed; the two
# rules after this one have no say then).
[rule.from]
weight = 0.2
variants = [
  { value = "own",  pack = 1.0, play = 1.0, size = 0.5 },
  { value = "tile", pack = 0.9, play = 0.6, size = 0.5 },
  { value = "guess", pack = 0.5, play = 0.2, size = 0.5 },
]

# What a pixel is guessed from, inside the tile.
[rule.predict]
weight = 0.3
variants = [
  { value = "none",  pack = 1.0, play = 1.0, size = 0.0 },
  { value = "left",  pack = 0.9, play = 0.9, size = 0.5 },
  { value = "up",    pack = 0.9, play = 0.9, size = 0.5 },
  { value = "paeth", pack = 0.6, play = 0.6, size = 0.8 },
  { value = "med",   pack = 0.7, play = 0.7, size = 0.9 },
]

# The coder that writes the tile's bytes.
[rule.coder]
weight = 0.5
variants = [
  { value = "deflate", pack = 0.7, play = 0.9, size = 0.4 },
  { value = "zstd",    pack = 0.3, play = 1.0, size = 0.6 },
  { value = "xz",      pack = 0.3, play = 0.3, size = 0.9 },
]

# Judges look at the whole set of choices, on the tile itself.
[judge]
# The size judge packs a sample of the tile with the choice and scores what it saved.
size = 10.0
# The sample: this many bands of this many rows, spread over the tile.
sample_bands = 8
band_rows = 16

# The guess: a plane is cut into this many bands of rows, guessed side by side.
[guess]
bands = 16

# Blocks (--coarse): how far a tile is looked for in the frame before, in pixels each way.
[block]
range = 7
# How much longer a finer wave's step is: the finest is (slope + 14) / slope times the flattest.
slope = 32
# A wave is counted in whole steps, rounded down but for a step's 1/dead (what is not
# nearly a step long is grain more often than picture).
dead = 12
# A tile counts as moved only when a moved place is this much more like it than the same
# place, summed over its 256 pixels (a vector that follows the grain costs bytes for nothing).
still = 256
# The packer tries the ways a tile can be guessed and keeps the one that weighs least:
# the squares of what is still wrong, plus this for every bit, times the square of the
# flattest step's length.
weigh = 0.1
# With --between, every second frame is guessed from the frame before it and the frame
# after it. Nothing is guessed from such a frame, so its steps may be this much longer.
between = 2.1
# With --between frames are packed in groups of this many. The last frame of a group is
# guessed from the last of the group before it; the middle one from those two; and so on
# inward. A frame that others are guessed from has steps only the square root of
# `between` longer.
group = 4
# May the packer keep a tile's light as one block of 16 x 16 when that weighs less than
# four of 8 x 8 (1) or not (0)? Measured on the guitar clip it gains nothing (1 % more
# bytes for 0.06 dB), so it is off; the player reads either.
large = 0

# The Predictive Motion Engine (--predict).
[predict]
# How many frames of each tile's vectors it remembers.
history = 4
# A cut: the brightness differs from the frame before by more than this on average
# (in levels). The frame after a cut stands alone, and the history starts again.
cut = 28

# Fractal mode (--fractal): a frame as rules that make it out of itself and out of the
# frames before it. HotMotor searches each range's rule and chooses how they are written.
[fractal]
# What a bit of a rule is worth, in squares of error (the command's --fractal N sets it).
lambda = 150
# How many places the beam keeps after the quick judge, for the exact judge to weigh.
beam = 4
# How far a block is looked for in the frames before, in pixels each way.
range = 7
# How far a domain is looked for in the frame itself, in half-size pixels each way.
window = 24
# How many times the player applies the rules to a frame that stands alone (from flat
# grey), and to a frame that starts from the frame before it.
rounds_alone = 10
rounds = 3
# The wave (--wave N): how many ticks, a pixel a tick, it moves out from a seam.
wave_ticks = 3

# Where a range comes from. The scores are taken off the rule's price in bits (times the
# weight): a rule that plays quickly and packs quickly may cost a little more error.
[fractal.rule.source]
weight = 0.5
variants = [
  { value = "skip",  pack = 1.0, play = 1.0, size = 1.0 },
  { value = "moved", pack = 0.6, play = 0.9, size = 0.6 },
  { value = "own",   pack = 0.2, play = 0.3, size = 0.5 },
  { value = "flat",  pack = 1.0, play = 1.0, size = 0.3 },
]

# How a frame's rules are written: a vector as it is, or told from the rule before.
[fractal.rule.vectors]
weight = 0.1
variants = [
  { value = "told",  pack = 0.9, play = 0.9, size = 0.7 },
  { value = "plain", pack = 1.0, play = 1.0, size = 0.4 },
]

# The same for a rule's brightness shift.
[fractal.rule.shifts]
weight = 0.1
variants = [
  { value = "plain", pack = 1.0, play = 1.0, size = 0.5 },
  { value = "told",  pack = 0.9, play = 0.9, size = 0.5 },
]

# The smoother: vectors between node A and node B.
[smoother]
# A vector is found per block of this many pixels.
block = 16
# How far a block may move from A to B, in pixels each way.
range = 24
# How much nearer per pixel (in grey levels) a moved block must match than a still one
# (so still things stay still and a vector does not follow the grain).
zero_bias = 12.0
# A block whose best match still differs this much per pixel is blended in place.
poor_match = 24.0

# The player rolling window in Nimbus, counted in nodes around the playhead.
[player]
# The strike (a bottle packed by the mix): the whole film's jobs are mapped, and struck
# in a rolling window of this many frames ahead of the last frame handed over.
window = 32
# Nodes made ready ahead of the playhead (unpacked, and their in-between frames guessed).
ahead = 24
# Nodes kept behind the playhead; older ones leave Nimbus.
behind = 24
