[package]
name = "fbottle"
version = "0.1.0"
edition = "2021"
description = "Frame Bottle: a movie as a grid of frames, packed by HotMotor, kept in Strike's Nimbus, glued into one .fbottle file"
publish = false

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
zstd = "0.13"
xz2 = { version = "0.1", features = ["static"] }
rayon = "1"
neuras = { path = "../Neuras" }
gif = "0.13"
minifb = "0.27"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[profile.release]
opt-level = 3
debug = 0
